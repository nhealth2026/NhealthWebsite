<!-- ========================================================================
     FLOATING BOTTOM MOBILE NAVIGATION DOCK (Exact from Mockup)
     ======================================================================== -->
<div class="p-bottom-dock-wrapper" id="pMobileBottomDock">
  <nav class="p-bottom-dock" aria-label="Bottom Navigation">
    <!-- 1. Home -->
    <a href="{{ url_for('main.index') }}" class="p-dock-tab active">
      <div class="p-dock-icon">
        <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      </div>
      <span>Home</span>
    </a>

    <!-- 2. Services -->
    <a href="#services-grid" class="p-dock-tab">
      <div class="p-dock-icon">
        <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
      </div>
      <span>Services</span>
    </a>

    <!-- 3. Floating Central Action: Book -->
    <div class="p-dock-fab-wrap">
      <button class="p-dock-fab open-booking-modal-btn" data-service="Doctor Consultation" title="Book Appointment" aria-label="Book Appointment">
        <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
        </svg>
      </button>
      <span class="p-dock-fab-label">Book</span>
    </div>

    <!-- 4. My Records -->
    <a href="{% if session.get('user_id') %}{{ url_for('main.dashboard') }}{% else %}{{ url_for('main.login') }}{% endif %}" class="p-dock-tab">
      <div class="p-dock-icon">
        <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
      </div>
      <span>My Records</span>
    </a>

    <!-- 5. More -->
    <button class="p-dock-tab" id="pMoreDrawerBtn" type="button" aria-label="More options">
      <div class="p-dock-icon">
        <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </div>
      <span>More</span>
    </button>
  </nav>
</div>

<!-- Mobile Drawer Overlay & Menu for "More" -->
<div class="nh-drawer-overlay" id="nhDrawerOverlay"></div>
<nav class="nh-mobile-drawer" id="nhMobileDrawer" aria-label="Mobile navigation">
  <div class="nh-drawer-header">
    <img src="{{ url_for('static', filename='images/logo-transparent.png') }}" alt="NHealth" style="height: 36px;" />
    <button class="nh-drawer-close-btn" id="nhDrawerCloseBtn" aria-label="Close">&#x2715;</button>
  </div>
  <div class="nh-drawer-nav">
    <a href="{{ url_for('main.index') }}" class="nh-drawer-nav-link active">🏠 Home</a>
    <a href="#services-grid" class="nh-drawer-nav-link">🩺 Our Services</a>
    <a href="#telemedicine" class="nh-drawer-nav-link">📞 Telemedicine</a>
    <a href="#analytics" class="nh-drawer-nav-link">📊 About Platform</a>
    <a href="https://wa.me/918001234567" target="_blank" class="nh-drawer-nav-link">🎧 24/7 Support</a>
  </div>
  <div class="nh-drawer-footer">
    <button class="nh-drawer-book-btn open-booking-modal-btn" data-service="General Consultation">📅 Book Appointment</button>
    {% if session.get('user_id') %}
    <a href="{{ url_for('main.dashboard') }}" class="nh-drawer-login-btn">My Dashboard</a>
    {% else %}
    <a href="{{ url_for('main.login') }}" class="nh-drawer-login-btn">Login / Sign Up</a>
    {% endif %}
  </div>
</nav>
