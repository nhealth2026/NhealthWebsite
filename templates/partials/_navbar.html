  <header class="nh-header nh-header-image2">
    <div class="nh-container">
      <div class="nh-nav-inner">
        <!-- Logo Branding -->
        <a href="#" class="nh-brand-logo-link">
          <img src="{{ url_for('static', filename='images/logo-transparent.png') }}" alt="NHealth Technologies Logo" class="nh-brand-logo-img" style="height: 44px;" />
        </a>

        <!-- Navigation Links (Desktop) -->
        <ul class="nh-nav-menu">
          <li class="nh-nav-item"><a href="#home" class="nh-nav-link-image2 active">Home</a></li>
          <li class="nh-nav-item dropdown">
            <a href="#services" class="nh-nav-link-image2">Our Services ⌵</a>
          </li>
          <li class="nh-nav-item"><a href="#services" class="nh-nav-link-image2">How It Works</a></li>
          <li class="nh-nav-item"><a href="#telemedicine" class="nh-nav-link-image2">About Us</a></li>
          <li class="nh-nav-item"><a href="#contact" class="nh-nav-link-image2">Contact</a></li>
        </ul>

        <!-- Action Controls -->
        <div class="nh-nav-actions" style="display: flex; align-items: center; gap: 0.75rem;">
          <!-- Search Icon Button (hidden on mobile to save space) -->
          <button class="nh-btn-search" style="background: none; border: none; cursor: pointer; color: #64748B; font-size: 1.15rem; display: flex; align-items: center; padding: 6px;" aria-label="Search">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </button>

          <!-- Login / Dashboard Button -->
          {% if session.get('user_id') %}
            <a href="{{ url_for('main.dashboard') }}" class="nh-btn-login-outline" style="text-decoration:none; display:inline-flex; align-items:center; gap:6px;">
              <span>Dashboard</span>
            </a>
          {% else %}
            <a href="{{ url_for('main.login') }}" class="nh-btn-login-outline" style="text-decoration:none; display:inline-flex; align-items:center;">
              <span>Login</span>
            </a>
          {% endif %}

          <!-- Book Now Button (hidden at 320px via responsive.css) -->
          <button class="nh-btn-book-teal open-booking-modal-btn" data-service="General Consultation">
            Book Now
          </button>

          <!-- Mobile Hamburger Button -->
          <button class="nh-mobile-menu-btn" id="nhMobileMenuBtn" aria-label="Open navigation menu" aria-expanded="false">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </header>

<!-- Mobile Drawer Overlay -->
<div class="nh-drawer-overlay" id="nhDrawerOverlay"></div>

<!-- Mobile Navigation Drawer -->
<nav class="nh-mobile-drawer" id="nhMobileDrawer" aria-label="Mobile navigation">
  <div class="nh-drawer-header">
    <img src="{{ url_for('static', filename='images/logo-transparent.png') }}" alt="NHealth" style="height: 36px;" />
    <button class="nh-drawer-close-btn" id="nhDrawerCloseBtn" aria-label="Close navigation">&#x2715;</button>
  </div>
  <div class="nh-drawer-nav">
    <a href="#home" class="nh-drawer-nav-link active">
      <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      Home
    </a>
    <a href="#services" class="nh-drawer-nav-link">
      <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
      Our Services
    </a>
    <a href="#services" class="nh-drawer-nav-link">
      <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      How It Works
    </a>
    <a href="#telemedicine" class="nh-drawer-nav-link">
      <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      About Us
    </a>
    <a href="#contact" class="nh-drawer-nav-link">
      <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
      Contact
    </a>
  </div>
  <div class="nh-drawer-footer">
    <button class="nh-drawer-book-btn open-booking-modal-btn" data-service="General Consultation">
      📅 Book Appointment
    </button>
    {% if session.get('user_id') %}
      <a href="{{ url_for('main.dashboard') }}" class="nh-drawer-login-btn">My Dashboard</a>
    {% else %}
      <a href="{{ url_for('main.login') }}" class="nh-drawer-login-btn">Login / Sign Up</a>
    {% endif %}
  </div>
</nav>

<script>
(function() {
  var btn = document.getElementById('nhMobileMenuBtn');
  var drawer = document.getElementById('nhMobileDrawer');
  var overlay = document.getElementById('nhDrawerOverlay');
  var closeBtn = document.getElementById('nhDrawerCloseBtn');
  function openDrawer() {
    drawer.classList.add('open');
    overlay.classList.add('open');
    if (btn) btn.setAttribute('aria-expanded', 'true');
    document.body.style.overflow = 'hidden';
  }
  function closeDrawer() {
    drawer.classList.remove('open');
    overlay.classList.remove('open');
    if (btn) btn.setAttribute('aria-expanded', 'false');
    document.body.style.overflow = '';
  }
  if (btn) btn.addEventListener('click', openDrawer);
  if (closeBtn) closeBtn.addEventListener('click', closeDrawer);
  if (overlay) overlay.addEventListener('click', closeDrawer);
  if (drawer) {
    drawer.querySelectorAll('.nh-drawer-nav-link').forEach(function(link) {
      link.addEventListener('click', closeDrawer);
    });
  }
})();
</script>
