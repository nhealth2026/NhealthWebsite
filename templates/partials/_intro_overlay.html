  <!-- ========================================================================
       LANDING INTRO ANIMATION OVERLAY
       Desktop/Laptop: desktop_animation.mp4
       Mobile: nhealth_animation.mp4
       ======================================================================== -->
  <div id="nhLandingIntro" class="nh-landing-intro-overlay" title="Click anywhere to skip intro"
       data-desktop-src="{{ url_for('static', filename='videos/desktop_animation.mp4') }}"
       data-mobile-src="{{ url_for('static', filename='videos/nhealth_animation.mp4') }}">
    <div class="nh-landing-video-container">
      <video id="nhLandingVideo" class="nh-landing-video" autoplay muted playsinline preload="auto">
        <source id="nhLandingVideoSource" src="{{ url_for('static', filename='videos/desktop_animation.mp4') }}" type="video/mp4" />
      </video>
    </div>

    <!-- Skip Button -->
    <button id="nhSkipIntroBtn" class="nh-skip-intro-btn" type="button" aria-label="Skip Intro">
      <span>Skip Intro</span>
      <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">

      </svg>
    </button>

    <!-- Bottom Progress Tracker -->
    <div class="nh-intro-progress-bar">
      <div id="nhIntroProgressFill" class="nh-intro-progress-fill"></div>
    </div>
  </div>
